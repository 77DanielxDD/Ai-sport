name: ai-sport-cloud

services:
  ai:
    image: ${AI_SERVICE_IMAGE:-ghcr.io/your-org/ai-sport-ai:latest}
    restart: unless-stopped
    profiles: ["with-ai"]
    environment:
      AI_MEDIA_BASE_DIR: /app/uploaded-videos/output
      AI_COS_ENABLED: ${AI_COS_ENABLED:-false}
      AI_COS_REGION: ${APP_OBJECT_STORAGE_REGION}
      AI_COS_BUCKET: ${APP_OBJECT_STORAGE_BUCKET}
      AI_COS_SECRET_ID: ${APP_OBJECT_STORAGE_ACCESS_KEY}
      AI_COS_SECRET_KEY: ${APP_OBJECT_STORAGE_SECRET_KEY}
      AI_COS_PUBLIC_BASE_URL: ${APP_OBJECT_STORAGE_PUBLIC_BASE_URL}
    expose:
      - "8000"
    volumes:
      - backend_uploads:/app/uploaded-videos

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      JPA_DDL_AUTO: update
      RABBIT_HOST: rabbitmq
      RABBIT_PORT: 5672
      RABBIT_USERNAME: ${RABBITMQ_USER}
      RABBIT_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBIT_VHOST: /
      AI_SERVICE_BASE_URL: ${AI_SERVICE_BASE_URL}
      VIDEO_UPLOAD_PATH: /app/uploaded-videos
      APP_MEDIA_BASE_DIR: /app/uploaded-videos/output
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      APP_OBJECT_STORAGE_ENABLED: ${APP_OBJECT_STORAGE_ENABLED}
      APP_OBJECT_STORAGE_PROVIDER: ${APP_OBJECT_STORAGE_PROVIDER}
      APP_OBJECT_STORAGE_REGION: ${APP_OBJECT_STORAGE_REGION}
      APP_OBJECT_STORAGE_BUCKET: ${APP_OBJECT_STORAGE_BUCKET}
      APP_OBJECT_STORAGE_ACCESS_KEY: ${APP_OBJECT_STORAGE_ACCESS_KEY}
      APP_OBJECT_STORAGE_SECRET_KEY: ${APP_OBJECT_STORAGE_SECRET_KEY}
      APP_OBJECT_STORAGE_PUBLIC_BASE_URL: ${APP_OBJECT_STORAGE_PUBLIC_BASE_URL}
      APP_OBJECT_STORAGE_ENDPOINT_SUFFIX: ${APP_OBJECT_STORAGE_ENDPOINT_SUFFIX}
      APP_CLEANUP_ENABLED: ${APP_CLEANUP_ENABLED}
      APP_CLEANUP_RETENTION_DAYS: ${APP_CLEANUP_RETENTION_DAYS}
      APP_CLEANUP_CRON: ${APP_CLEANUP_CRON}
    volumes:
      - backend_uploads:/app/uploaded-videos
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/api/system/health"]
      interval: 15s
      timeout: 5s
      retries: 20

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: /
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "${GATEWAY_HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/cloud/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  mysql_data:
  rabbitmq_data:
  backend_uploads:
