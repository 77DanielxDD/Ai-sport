spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=${SERVER_PORT:8080}

spring.servlet.multipart.max-file-size=${APP_MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${APP_MAX_REQUEST_SIZE:50MB}

management.endpoints.web.exposure.include=health,info,mappings,prometheus,metrics
management.endpoint.health.show-details=always
management.endpoint.prometheus.access=unrestricted

mq.queue.video-analysis=${MQ_VIDEO_QUEUE:video-analysis-queue}
mq.routing-key.video-analysis=${MQ_VIDEO_ROUTING_KEY:video-analysis-routing-key}
mq.exchange.video-analysis=${MQ_VIDEO_EXCHANGE:video-analysis-exchange}
mq.queue.video-analysis.dlq=${MQ_VIDEO_DLQ:video-analysis-dlq}
mq.routing-key.video-analysis.dlq=${MQ_VIDEO_DLQ_ROUTING:video-analysis-dlq-routing}
mq.exchange.dlq=${MQ_DLQ_EXCHANGE:dlq-exchange}
mq.queue.ttl=${MQ_QUEUE_TTL:600000}
mq.queue.max-length=${MQ_QUEUE_MAX_LENGTH:10000}
mq.queue.dead-letter-exchange=${MQ_QUEUE_DLX:dlq-exchange}
mq.queue.dead-letter-routing-key=${MQ_QUEUE_DLK:video-analysis-dlq-routing}

video.upload.path=${VIDEO_UPLOAD_PATH:./uploaded-videos}
video.process.timeout=${VIDEO_PROCESS_TIMEOUT_MS:300000}

ai.service.base-url=${AI_SERVICE_BASE_URL:http://127.0.0.1:8000}
ai.python.analyze-path=${AI_PYTHON_ANALYZE_PATH:/analyze}
ai.python.connect-timeout-ms=${AI_PYTHON_CONNECT_TIMEOUT_MS:10000}
ai.python.timeout-ms=${AI_PYTHON_TIMEOUT_MS:300000}

app.media.base-dir=${APP_MEDIA_BASE_DIR:./uploaded-videos/output}

app.jwt.secret=${APP_JWT_SECRET:replace-with-at-least-32-bytes-secret-key-for-production}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

app.rate-limit.enabled=${APP_RATE_LIMIT_ENABLED:true}
app.rate-limit.max-requests-per-minute=${APP_RATE_LIMIT_RPM:300}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.analysis.fallback-local-async-when-mq-down=${APP_ANALYSIS_FALLBACK:true}

app.experiment.python=${APP_EXPERIMENT_PYTHON:python}
app.experiment.script-path=${APP_EXPERIMENT_SCRIPT_PATH:evaluation/action_analysis/scripts/evaluate_action_analysis.py}
app.admin.usernames=${APP_ADMIN_USERNAMES:admin}

app.cleanup.enabled=${APP_CLEANUP_ENABLED:false}
app.cleanup.retention-days=${APP_CLEANUP_RETENTION_DAYS:30}
app.cleanup.cron=${APP_CLEANUP_CRON:0 30 3 * * *}

app.object-storage.enabled=${APP_OBJECT_STORAGE_ENABLED:false}
app.object-storage.provider=${APP_OBJECT_STORAGE_PROVIDER:cos}
app.object-storage.region=${APP_OBJECT_STORAGE_REGION:ap-guangzhou}
app.object-storage.bucket=${APP_OBJECT_STORAGE_BUCKET:}
app.object-storage.access-key=${APP_OBJECT_STORAGE_ACCESS_KEY:}
app.object-storage.secret-key=${APP_OBJECT_STORAGE_SECRET_KEY:}
app.object-storage.public-base-url=${APP_OBJECT_STORAGE_PUBLIC_BASE_URL:}
app.object-storage.endpoint-suffix=${APP_OBJECT_STORAGE_ENDPOINT_SUFFIX:}

app.redis.cache.enabled=${APP_REDIS_CACHE_ENABLED:false}
spring.data.redis.host=${APP_REDIS_HOST:127.0.0.1}
spring.data.redis.port=${APP_REDIS_PORT:6379}
spring.data.redis.password=${APP_REDIS_PASSWORD:}
spring.data.redis.timeout=${APP_REDIS_TIMEOUT:3s}
app.analysis.queue-recovery.enabled=${APP_ANALYSIS_QUEUE_RECOVERY_ENABLED:true}
app.analysis.queue-recovery-interval-ms=${APP_ANALYSIS_QUEUE_RECOVERY_INTERVAL_MS:3000}
app.analysis.queue-stuck-seconds=${APP_ANALYSIS_QUEUE_STUCK_SECONDS:6}

