spring.datasource.url=${DEV_DB_URL:jdbc:mysql://localhost:3306/ai_sport?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
spring.datasource.username=${DEV_DB_USERNAME:root}
spring.datasource.password=${DEV_DB_PASSWORD:Dengbaba777}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${DEV_JPA_DDL_AUTO:update}
spring.jpa.show-sql=${DEV_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.rabbitmq.host=${DEV_RABBIT_HOST:localhost}
spring.rabbitmq.port=${DEV_RABBIT_PORT:5673}
spring.rabbitmq.username=${DEV_RABBIT_USERNAME:guest}
spring.rabbitmq.password=${DEV_RABBIT_PASSWORD:guest}
spring.rabbitmq.virtual-host=${DEV_RABBIT_VHOST:/}
spring.rabbitmq.cache.channel.size=25
spring.rabbitmq.cache.channel.checkout-timeout=2000
spring.rabbitmq.listener.simple.concurrency=3
spring.rabbitmq.listener.simple.max-concurrency=10
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.listener.simple.acknowledge-mode=auto

logging.level.root=${DEV_LOG_LEVEL_ROOT:INFO}
logging.level.com.example.aisport=${DEV_LOG_LEVEL_APP:INFO}

# Python AI service writes report images under Ai-Sport(python)/output
app.media.base-dir=${DEV_MEDIA_BASE_DIR:D:/BaiduNetdiskDownload/Ai-Sport(python)/output}

# COS object storage (set DEV_OBJECT_STORAGE_ENABLED=true to enable)
app.object-storage.enabled=${DEV_OBJECT_STORAGE_ENABLED:false}
app.object-storage.provider=${DEV_OBJECT_STORAGE_PROVIDER:cos}
app.object-storage.region=${DEV_OBJECT_STORAGE_REGION:ap-guangzhou}
app.object-storage.bucket=${DEV_OBJECT_STORAGE_BUCKET:}
app.object-storage.access-key=${DEV_OBJECT_STORAGE_ACCESS_KEY:}
app.object-storage.secret-key=${DEV_OBJECT_STORAGE_SECRET_KEY:}
app.object-storage.public-base-url=${DEV_OBJECT_STORAGE_PUBLIC_BASE_URL:}
app.object-storage.endpoint-suffix=${DEV_OBJECT_STORAGE_ENDPOINT_SUFFIX:}

