spring.datasource.url=jdbc:h2:mem:aisport_test;MODE=MySQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.rabbitmq.host=127.0.0.1
spring.rabbitmq.port=5679
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.dynamic=false

video.upload.path=./target/test-uploaded-videos
app.media.base-dir=./target/test-uploaded-videos/output

ai.service.base-url=http://127.0.0.1:18000
ai.python.connect-timeout-ms=200
ai.python.timeout-ms=500

app.analysis.fallback-local-async-when-mq-down=true
app.cleanup.enabled=false
app.object-storage.enabled=false
